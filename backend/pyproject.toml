[project]
name = "meshcore-commander-backend"
version = "0.1.0"
description = "FastAPI backend for MeshCore Commander"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.3.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "meshcore>=2.3.7",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-json-logger>=2.0.7",
  "sqlalchemy[asyncio]>=2.0.32",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
