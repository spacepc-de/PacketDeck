services:
  backend:
    build:
      context: ./backend
      network: host
    network_mode: host
    env_file:
      - .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://meshcore:meshcore@127.0.0.1:5432/meshcore
      MQTT_URL: mqtt://127.0.0.1:1883
      MESHCORE_CONNECTION_TYPE: tcp
      MESHCORE_TCP_HOST: 192.168.2.118
      MESHCORE_TCP_PORT: "5000"
      MESHCORE_AUTO_RECONNECT: "true"
      CORS_ORIGINS: http://192.168.2.49:8090,http://localhost:8090,http://localhost:5173
      AUTH_ENABLED: "false"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      network: host
    environment:
      PUBLIC_API_BASE_URL: http://192.168.2.49:8000/api/v1
      PUBLIC_WS_URL: ws://192.168.2.49:8000/api/v1/ws/events
    ports:
      - "8090:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meshcore
      POSTGRES_USER: meshcore
      POSTGRES_PASSWORD: meshcore
    ports:
      - "5432:5432"
    volumes:
      - packetdeck_postgres_data:/var/lib/postgresql/data

volumes:
  packetdeck_postgres_data:
