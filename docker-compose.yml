services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://meshcore:meshcore@postgres:5432/meshcore
      MQTT_URL: mqtt://mqtt:1883
      MESHCORE_CONNECTION_TYPE: tcp
      MESHCORE_TCP_HOST: ${MESHCORE_TCP_HOST:-192.168.2.118}
      MESHCORE_TCP_PORT: ${MESHCORE_TCP_PORT:-5000}
      MESHCORE_AUTO_RECONNECT: "true"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/events
    ports:
      - "8080:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meshcore
      POSTGRES_USER: meshcore
      POSTGRES_PASSWORD: meshcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres_data:
